    function getExecuteTime() {

        return Date.now() + syncOffset;

    function runAt(time, fn) {

        const delay = time - Date.now();

        if (delay <= 0) {

            fn();

        } else {

            setTimeout(fn, delay);

        }

    }






function renderScores(scores) {

    window.latestScores = scores;

    if (!scores || Object.keys(scores).length === 0) {
        scoreboard.innerHTML = "<p>Aucun score pour le moment.</p>";

    }

    const sorted = Object.entries(scores)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

    const tbody = document.createElement('tbody');

    table.innerHTML = `
        <thead>

                <th>JOUEURS</th>

        const row = document.createElement('tr');

        row.innerHTML = `

            <td>${player}</td>
            <td>${score}</td>
        `;

        tbody.appendChild(row);
    });

    table.appendChild(tbody);

    scoreboard.innerHTML = '';
    scoreboard.appendChild(table);
}

async function preloadQuizMedia(questions, onProgress) {

    preloadedMedia = {};

    const allMedia = [];

    for (const q of questions) {
        if (q.mediaExplanation2) allMedia.push(q.mediaExplanation2);
        if (q.mediaAnswer2) allMedia.push(q.mediaAnswer2);
        if (q.mediaImage) allMedia.push(q.mediaImage);
    }

    const total = allMedia.length;
    let loaded = 0;

    const promises = [];

    const updateProgress = () => {
        loaded++;
        if (onProgress) {
            onProgress({
                loaded,
                total,
                percent: total === 0 ? 100 : Math.round((loaded / total) * 100)
            });
        }
    };

    for (const media of allMedia) {

        if (!media || typeof media !== "string") continue;
        if (preloadedMedia[media]) continue;

        const ext = media.split('.').pop().toLowerCase();

        let p;

        if (["jpg","jpeg","png","gif","webp"].includes(ext)) {

            const img = new Image();

            p = new Promise(res => {
                img.onload = img.onerror = () => {
                    updateProgress();
                    res(media);
                };
            });

            img.src = media;
            preloadedMedia[media] = img;
        }

        else if (["mp3","wav","ogg"].includes(ext)) {

            const audio = new Audio();
            audio.preload = "auto";
            audio.src = media;

            p = new Promise(res => {
                audio.oncanplaythrough = audio.onerror = () => {
                    updateProgress();
                    res(media);
                };
            });

            preloadedMedia[media] = audio;
        }

        else if (["mp4","webm"].includes(ext)) {

    const video = document.createElement("video");

    // PRELOAD LEGER
    video.preload = "metadata";

    // optimisations Chrome
    video.muted = true;
    video.playsInline = true;

    video.src = media;

    p = new Promise(res => {

        let finished = false;

        const done = () => {

            if (finished) return;
            finished = true;

            updateProgress();
            res(media);
        };

        // charge uniquement les metadata
        video.onloadedmetadata = done;

        // sécurité erreur
        video.onerror = done;

        // anti blocage Promise.all
        setTimeout(done, 1500);

    });

    // on stocke seulement l'URL
    // PAS le vrai élément vidéo
    preloadedMedia[media] = {
        type: "video",
        src: media
    };
}

if (p) promises.push(p);
}

await Promise.all(promises);

return true;
}

function getPreloadedMedia(media) {

    if (!media) return null;

    return preloadedMedia[media] || null;

}







function showLocalPreview(media) {

    const preview =
        document.getElementById('livePreview');

    if (!preview) return;

    preview.innerHTML = '';

    if (!media) return;

    const lower = media.toLowerCase();

    // =========================
    // IMAGE
    // =========================
    if (/\.(jpg|jpeg|png|gif|webp)$/i.test(lower)) {

        const img = getPreloadedMedia(media);

        if (img) {

            const clone = img.cloneNode();

            clone.style.maxWidth = "100%";
            clone.style.maxHeight = "500px";

            preview.appendChild(clone);

        } else {

            const imgEl = document.createElement("img");

            imgEl.src = media;
            imgEl.style.maxWidth = "100%";
            imgEl.style.maxHeight = "500px";

            preview.appendChild(imgEl);

        }

    }

    // =========================
    // VIDEO
    // =========================
    else if (/\.(mp4|webm)$/i.test(lower)) {

        const video = document.createElement("video");

video.src = media;

// ULTRA LIGHT
video.preload = "metadata";

// PAS d'autoplay
video.controls = true;

// important
video.muted = true;
video.playsInline = true;

// optimisation rendering
video.disablePictureInPicture = true;

video.style.maxWidth = "100%";
video.style.maxHeight = "280px";
video.style.borderRadius = "10px";

preview.appendChild(video);

        }



    // =========================
    // AUDIO
    // =========================
    else if (/\.(mp3|wav|ogg)$/i.test(lower)) {

        const audio = getPreloadedMedia(media);

        if (audio) {

            const clone = audio.cloneNode();

            clone.controls = true;

            preview.appendChild(clone);

        } else {

            const audioEl =
                document.createElement("audio");

            audioEl.src = media;
            audioEl.controls = true;

            preview.appendChild(audioEl);

        }

    }

}





function stopAllMedia() {

    const preview = document.getElementById('livePreview');
    if (preview) preview.innerHTML = '';

    document.querySelectorAll('audio').forEach(a => {
        a.pause();
        a.currentTime = 0;
        a.src = "";
        a.load();
    });

    document.querySelectorAll('video').forEach(v => {
        v.pause();
        v.currentTime = 0;
        v.src = "";
        v.load();
    });

    console.log("🛑 MEDIA STOPPED");
}







    socket.emit('sendQuestion', {

    window.sendQuestionAndMedia = function(index) {

        if (!Array.isArray(loadedQuestions)) {

            console.warn("❌ loadedQuestions invalide");
            return;

        }

        const question = loadedQuestions[index];

        if (!question) {

            console.warn(
                "❌ Question introuvable à l’index :",
                index
            );

            return;

        }

        selectedQuestionIndex = index;

        const executeAt = getExecuteTime();

        // START BUZZ
        socket.emit('startBuzzQuestion', {

            index,
            theme: currentTheme

        });

        // QUESTION SCREEN
        const payload = {

            question:
                question.question ??
                question.answer ??
                "Question",

            options:
                Array.isArray(question.options)
                    ? question.options
                    : [],

            type: question.type ?? null,
            executeAt

        };

        console.log(
            "📤 newQuestion SENT:",
            payload
        );

        socket.emit('sendQuestion', payload);

        buzzedPlayers = [];

        updateBuzzedPlayersList();

        // MEDIA EXPLANATION 2
        if (
            question.type === 'audio' &&
            question.mediaImage
        ) {

            socket.emit('showMediaExplanation2', {

                audio:
                    question.mediaExplanation2 ?? null,

                image:
                    question.mediaImage ?? null,

                executeAt

            });

            runAt(executeAt, () => {

                if (question.mediaImage) {

                    showLocalPreview(
                        question.mediaImage
                    );

                }

            });

            return;

        }

        // MEDIA SIMPLE
        if (
            typeof question.mediaExplanation2 === 'string' &&
            question.mediaExplanation2.trim() !== ''
        ) {

            const mediaUrl =
                question.mediaExplanation2.startsWith('/')
                    ? question.mediaExplanation2
                    : '/' + question.mediaExplanation2;

            socket.emit('showMediaExplanation2', {

                media: mediaUrl,
                executeAt

            });

            runAt(executeAt, () => {

                showLocalPreview(mediaUrl);

            });

            return;

        }

    };




    window.validateAnswer2 = function(index) {

        const question = loadedQuestions[index];

        if (!question) return;

        let payload = question.mediaAnswer2;

        // STRING
        if (typeof payload === 'string') {

            socket.emit('showMediaAnswer2', payload);

            showLocalPreview(payload);

            return;

        }

        // OBJECT
        if (
            typeof payload === 'object' &&
            !Array.isArray(payload)
        ) {

            socket.emit('showMediaAnswer2', payload);

            if (payload.image)
                showLocalPreview(payload.image);

            else if (payload.video)
                showLocalPreview(payload.video);

            else if (payload.audio)
                showLocalPreview(payload.audio);

            return;

        }

        console.warn(
            "⚠️ FORMAT MEDIA INVALIDE :",
            payload
        );

    };

    function updateBuzzedPlayersList() {

        const container =
            document.getElementById(
                'buzzedPlayersList'
            );

        container.innerHTML = '';

        if (buzzedPlayers.length === 0) {

            container.innerHTML =
                "<center><p>Aucun joueur n'a encore buzzé</p></center>";

            return;

        }

        buzzedPlayers
            .slice(0,5)
            .forEach((player, idx) => {

                const div =
                    document.createElement('div');

                div.textContent =
                    `${idx+1}. ${player}`;

                div.style.fontSize = "24px";

                const btn =
                    document.createElement('button');

                btn.textContent = "VALIDER";

                btn.style.marginLeft = "15px";
                btn.style.backgroundColor = "#22c55e";
                btn.style.color = "white";
                btn.style.border = "none";

                btn.classList.add('blink');

                btn.onclick = () => {

                    btn.classList.remove('blink');

                    socket.emit(
                        'validatePlayerAnswer',
                        {
                            playerName: player
                        }
                    );

                };

                div.appendChild(btn);

                container.appendChild(div);

            });

    }

    socket.on('updateBuzzList', (players) => {

        buzzedPlayers =
            Array.isArray(players)
                ? players
                : [];

        updateBuzzedPlayersList();

    });

  const sorted = Object.entries(scores)

    socket.on('showPodium', (podium) => {

        if (!podium || podium.length === 0) {

            podiumDiv.innerHTML =
                "<p>Aucun podium à afficher.</p>";

            return;

        }

        const podiumHTML = podium
            .map((player,idx) => `
                <p>
                    ${idx+1}.
                    ${player.playerName}
                    (${player.score} pts)
                </p>
            `)
            .join('');

        podiumDiv.innerHTML = podiumHTML;
